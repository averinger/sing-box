name: Build Android libbox.aar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем ОФИЦИАЛЬНЫЙ репозиторий SagerNet/sing-box
      - name: Checkout SagerNet/sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: dev # У sing-box основная ветка dev
          fetch-depth: 0
          fetch-tags: true

      # 2. Устанавливаем Go
      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # 3. Устанавливаем правильный gomobile (форк от sagernet)
      - name: Install gomobile and gobind
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # 4. Устанавливаем Android SDK и NDK
      - name: Set up Android SDK and NDK
        uses: nwtgck/actions-android-sdk@v28
        with:
          sdk-version: 34
          ndk-version: 27.0.12077973

      # 5. Запускаем ОФИЦИАЛЬНЫЙ скрипт сборки libbox
      - name: Build libbox.aar
        run: |
          go run ./cmd/internal/build_libbox -target android -tags "with_quic,with_wireguard,with_utls,with_clash_api,with_gvisor"

      # 6. Загружаем результат
      - name: Upload libbox.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android
          path: libbox.aar
          if-no-files-found: error
