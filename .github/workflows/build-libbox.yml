name: Build Android libbox.aar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем ОРИГИНАЛЬНЫЙ репозиторий SagerNet/sing-box (а не форк)
      - name: Checkout official sing-box repository
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: dev # или main, если dev недоступен
          fetch-depth: 0 # Скачиваем всю историю, включая теги

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build libbox.aar
        run: |
          # Устанавливаем NDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          # Собираем библиотеку с нужными тегами
          go run ./cmd/internal/build_libbox -target android -tags "with_quic,with_wireguard,with_utls,with_clash_api,with_gvisor"

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android
          path: libbox.aar
